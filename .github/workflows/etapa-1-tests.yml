name: Etapa 1 - pruebas de dominio
on:
  push:
    branches: [desarrollo/etapa-1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas del dominio
        run: npm test
