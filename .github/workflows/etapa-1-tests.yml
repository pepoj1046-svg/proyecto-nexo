name: Laboratorio - dominio y PostgreSQL
on:
  push:
    branches: [desarrollo/etapa-1, desarrollo/etapa-2]
  pull_request:
    branches: [main, desarrollo/etapa-1]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    name: tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci --no-fund
      - name: Dominio y PostgreSQL local aislado
        run: npm run test:all
