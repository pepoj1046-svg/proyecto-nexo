name: Laboratorio - dominio y PostgreSQL
on:
  push:
    branches: [desarrollo/etapa-1, desarrollo/etapa-2, desarrollo/etapa-3, desarrollo/etapa-4]
  pull_request:
    branches: [main, desarrollo/etapa-1, desarrollo/etapa-2, planificacion/etapa-4a, desarrollo/etapa-4]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    name: tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # 4A.2: 473 cases / 44 isolated browser-PG labs. Windows/22 completed
    # every test and restart in 25m05s but the 25m job was marked cancelled.
    # Budget the measured full workload and runner cleanup; per-test, HTTP,
    # SQL and launcher deadlines are unchanged, with no automatic retries.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci --no-fund
      - name: Dominio y PostgreSQL local aislado
        run: npm run test:all
      - name: Instalar Chromium de pruebas
        run: npx --no-install playwright install chromium
      - name: Interfaz web local - escritorio y móvil
        run: npm run test:web
